services:
  # =================================================================
  # Spring Boot 3 Backend Service on Render
  # =================================================================
  - type: web
    name: codeorbit-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,mysql
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: https://codeorbit.online,https://www.codeorbit.online,https://codeorbit.vercel.app,http://localhost:3000
      - key: ADMIN_BOOTSTRAP_ENABLED
        value: "true"
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@codeorbit.dev
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: test
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false


