services:
  # =================================================================
  # 1. Database Service (MySQL 8.0)
  # Not exposed publicly; accessible only within Docker internal network
  # =================================================================
  mysql:
    image: mysql:8.0
    container_name: codeorbit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-codeorbit_db}
      MYSQL_USER: ${DB_USER:-codeorbit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - codeorbit-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =================================================================
  # 2. Backend Service (Spring Boot 3 + Java 21)
  # Port 8080 exposed only internally on the private Docker network
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeorbit-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-codeorbit_db}
      DB_USER: ${DB_USER:-codeorbit_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEED_DEMO_DATA: "false"
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@codeorbit.dev}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-CodeOrbit Store Admin}
    volumes:
      - pdf_storage:/app/storage/private/pdfs
    networks:
      - codeorbit-network
    expose:
      - "8080"

  # =================================================================
  # 3. Frontend Service (React / Vite served via Nginx Reverse Proxy)
  # Only public entry point on port 80 (or ${PORT})
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeorbit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    networks:
      - codeorbit-network

# =================================================================
# Persistent Named Volumes
# =================================================================
volumes:
  mysql_data:
    driver: local
  pdf_storage:
    driver: local

# =================================================================
# Private Internal Network
# =================================================================
networks:
  codeorbit-network:
    driver: bridge
