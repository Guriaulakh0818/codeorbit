server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: codeorbit-backend

  # Active profile: 'dev' uses H2 in-memory by default for instant out-of-the-box local runs.
  # Set SPRING_PROFILES_ACTIVE=mysql to connect to MySQL database named 'codeorbit_db'.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  storage:
    private-pdf-path: ${PRIVATE_PDF_STORAGE_PATH:./storage/private/pdfs}
  jwt:
    secret: ${JWT_SECRET:CodeOrbitSecureDefaultSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_Tdcey9J28qwa6k}
    key-secret: ${RAZORPAY_KEY_SECRET:CaoFenS2A7RPK3LIywV340Bd}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_placeholder789}
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@codeorbit.dev}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@CodeOrbit2026!}
      name: ${ADMIN_BOOTSTRAP_NAME:CodeOrbit Store Admin}

codeorbit:
  seed-demo-data: ${SEED_DEMO_DATA:true}


---
# -------------------------------------------------------------
# Development Profile (In-Memory H2 for friction-free testing)
# -------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:codeorbit_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# -------------------------------------------------------------
# MySQL Profile (Production / Local MySQL Server)
# -------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: mysql

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    validate-on-migrate: true
    locations: classpath:db/migration

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:${MYSQL_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:codeorbit_db}?useSSL=${DB_USE_SSL:true}&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}}}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:${MYSQLUSER:${MYSQL_USER:root}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

---
# -------------------------------------------------------------
# Production Hardening Profile
# -------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

codeorbit:
  seed-demo-data: false
